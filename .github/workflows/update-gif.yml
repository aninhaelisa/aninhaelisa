name: Atualizar GIF aleatório

on:
  schedule:
    # Roda todo dia à meia-noite (UTC)
    - cron: '0 0 * * *'
  # Permite rodar manualmente pela aba "Actions"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Atualizar cache buster no README
        run: |
          # Gera um timestamp único
          TIMESTAMP=$(date +%s)
          # Substitui a URL que contém "?v=" por uma nova com o timestamp
          # Agora com a sua URL do Worker
          sed -i "s|https://bitter-river-59ae.elisaana-2019-2006.workers.dev/?v=[0-9]*|https://bitter-river-59ae.elisaana-2019-2006.workers.dev/?v=$TIMESTAMP|" README.md

      - name: Commit e push das alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza GIF aleatório [skip ci]"
          file_pattern: README.md
